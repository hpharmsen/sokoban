[project]
name = "sokoban"
version = "0.1.0"
description = "Sokoban implementation using the gridworld grid"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["gridworld", "pygame-ce>=2.5.8"]

[tool.uv]
package = false

[tool.uv.sources]
gridworld = { path = "../gridworld", editable = true }
